# ==============================================================================
# Apache VirtualHost para y2s.fergavaz.duckdns.org
# Aplicación: Spotify to YouTube Music Web
# Ruta física: /var/www/html/y2s
# Servidor interno: Gunicorn (127.0.0.1:5000)
# ==============================================================================

<VirtualHost *:80>
    ServerName y2s.fergavaz.duckdns.org
    ServerAdmin webmaster@fergavaz.duckdns.org

    # Servir archivos estáticos directamente mediante Apache (mayor rendimiento)
    Alias /static /var/www/html/y2s/static
    <Directory /var/www/html/y2s/static>
        Require all granted
    </Directory>

    # Configuración de Proxy Inverso hacia Gunicorn
    ProxyPreserveHost On
    ProxyPass /static !
    ProxyPass / http://127.0.0.1:5000/ timeout=300
    ProxyPassReverse / http://127.0.0.1:5000/

    # Cabeceras estándar de proxy inverso
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader set X-Forwarded-Port expr=%{SERVER_PORT}
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"

    # Timeout extendido para procesos largos de transferencia y polling en vivo
    ProxyTimeout 300

    # Logs de Apache específicos para este dominio
    ErrorLog ${APACHE_LOG_DIR}/y2s_error.log
    CustomLog ${APACHE_LOG_DIR}/y2s_access.log combined
</VirtualHost>

# ------------------------------------------------------------------------------
# Configuración HTTPS / SSL (opcional para activar con Let's Encrypt / Certbot)
# Puedes generar tu certificado gratuito ejecutando en Debian:
#   sudo certbot --apache -d y2s.fergavaz.duckdns.org
# Certbot configurará automáticamente la redirección HTTPS y el puerto 443.
# ------------------------------------------------------------------------------
