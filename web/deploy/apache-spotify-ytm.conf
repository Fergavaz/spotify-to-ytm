<VirtualHost *:80>
#<VirtualHost *:80 [::]:80>
ServerName y2s.fergavaz.duckdns.org

    LogLevel error
    ErrorLog ${APACHE_LOG_DIR}/y2s-referrer-error.log   
    CustomLog ${APACHE_LOG_DIR}/y2s-access.log combined

RewriteEngine on
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>


<IfModule mod_ssl.c>
<VirtualHost *:443>
#<VirtualHost *:443 [::]:443>
ServerName y2s.fergavaz.duckdns.org

    LogLevel error
    ErrorLog ${APACHE_LOG_DIR}/y2s-referrer-error.log   
    CustomLog ${APACHE_LOG_DIR}/y2s-access.log combined

    # Permite rutas con caracteres codificados sin devolver error 404
    AllowEncodedSlashes NoDecode

    # --------------------------------------------------------------------------
    # Servir archivos estáticos directamente mediante Apache (alto rendimiento)
    # --------------------------------------------------------------------------
    Alias /static /var/www/html/y2s/static
    <Directory /var/www/html/y2s/static>
        Require all granted
    </Directory>

    # --------------------------------------------------------------------------
    # Configuración de Proxy Inverso hacia Gunicorn (127.0.0.1:5000)
    # --------------------------------------------------------------------------
    ProxyRequests Off
    ProxyPreserveHost On

    <Proxy *>
        Order Allow,Deny
        Allow from All
    </Proxy>

    # No enviar /static a Gunicorn, dejar que lo sirva Apache
    ProxyPass /static !
    ProxyPass / http://127.0.0.1:5000/ timeout=300
    ProxyPassReverse / http://127.0.0.1:5000/
    ProxyVia On 

    # Cabeceras de proxy inverso
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"
    ProxyTimeout 300

    # --------------------------------------------------------------------------
    # Certificado SSL Let's Encrypt (Certificado wildcard fergavaz.duckdns.org)
    # --------------------------------------------------------------------------
    SSLEngine On
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/fergavaz.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/fergavaz.duckdns.org/privkey.pem
</VirtualHost>
</IfModule>
