# Apache VirtualHost para Spotify to YouTube Music Web
# Dominio: y2s.fergavaz.duckdns.org
# Directorio: /var/www/html/y2s
# Método recomendado: Proxy Inverso hacia Gunicorn (127.0.0.1:5000)

<VirtualHost *:80>
    ServerName y2s.fergavaz.duckdns.org
    ServerAdmin webmaster@fergavaz.duckdns.org

    # Servir archivos estáticos directamente mediante Apache
    Alias /static /var/www/html/y2s/static
    <Directory /var/www/html/y2s/static>
        Require all granted
    </Directory>

    # Configuración de Proxy Inverso hacia Gunicorn
    ProxyPreserveHost On
    ProxyPass /static !
    ProxyPass / http://127.0.0.1:5000/ timeout=300
    ProxyPassReverse / http://127.0.0.1:5000/

    # Cabeceras estándar de proxy
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader set X-Forwarded-Port expr=%{SERVER_PORT}
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"

    ProxyTimeout 300

    # Logs de Apache
    ErrorLog ${APACHE_LOG_DIR}/y2s_error.log
    CustomLog ${APACHE_LOG_DIR}/y2s_access.log combined
</VirtualHost>
