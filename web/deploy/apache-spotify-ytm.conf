# Apache VirtualHost para Spotify to YouTube Music Web
# Método recomendado: Proxy Inverso hacia Gunicorn (127.0.0.1:5000)

<VirtualHost *:80>
    ServerName spotify-ytm.local
    # ServerAlias www.tudominio.com
    ServerAdmin webmaster@localhost

    # Redirección de peticiones estáticas directa (opcional para máximo rendimiento)
    Alias /static /var/www/spotify-to-ytm-web/static
    <Directory /var/www/spotify-to-ytm-web/static>
        Require all granted
    </Directory>

    # Configuración de Proxy Inverso hacia Gunicorn
    ProxyPreserveHost On
    ProxyPass /static !
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Cabeceras estándar de proxy
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # Logs de Apache
    ErrorLog ${APACHE_LOG_DIR}/spotify_ytm_error.log
    CustomLog ${APACHE_LOG_DIR}/spotify_ytm_access.log combined
</VirtualHost>
