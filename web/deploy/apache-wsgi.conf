# Apache VirtualHost alternativo usando mod_wsgi (libapache2-mod-wsgi-py3)
# Descomentar/usar solo si se prefiere mod_wsgi en lugar del proxy inverso Gunicorn.

<VirtualHost *:80>
    ServerName spotify-ytm.local
    ServerAdmin webmaster@localhost

    WSGIDaemonProcess spotify_ytm user=www-data group=www-data threads=5 python-home=/var/www/spotify-to-ytm-web/venv
    WSGIScriptAlias / /var/www/spotify-to-ytm-web/wsgi.py

    <Directory /var/www/spotify-to-ytm-web>
        WSGIProcessGroup spotify_ytm
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    Alias /static /var/www/spotify-to-ytm-web/static
    <Directory /var/www/spotify-to-ytm-web/static>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/spotify_ytm_wsgi_error.log
    CustomLog ${APACHE_LOG_DIR}/spotify_ytm_wsgi_access.log combined
</VirtualHost>
